<!DOCTYPE html>
<html>
<head>

    <title>Kaart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
    <style>
        body {padding: 0; margin: 0;}
        html, body {
            height: 100%;
            width: 100%;
        }
        #kaardikiht {
            width: 100%;
            height: 100%;
        }
    </style>
    <script>

        var kaart;
        var hypik;


        function algus(){

            kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);

            new L.TileLayer(
                'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png?ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
                {
                    attribution: 'Map: <a href="http://www.maaamet.ee/">Maa-amet</a>',
                    tms: true
                }
            ).addTo(kaart);


            fetch("https://script.google.com/macros/s/AKfycbxs_RyymkTI6PYOBV3xjcHEfv555pxwC6wHReHisPEIMV_3XS5xBWXHnQe6ASXkUPY/exec")
                .then(d => d.json())
                .then(kuva);


            console.log("tellitud");

        }



        function kuva(kohad){

            console.log(kohad);


            for(let koht of kohad){

                L.marker([koht[0], koht[1]])

                    .addTo(kaart)

                    .bindTooltip(
                        koht[4],
                        {
                            permanent: true,
                            direction: "right",
                            offset: [10, 0]
                        }
                    )

                    .bindPopup(
                        "<b>" + koht[4] + "</b><br>" +
                        koht[2] + "<br>" +
                        koht[3]
                    );

            }

        }

    </script>

</head>


<body onload="algus()">

    <div id="kaardikiht"></div>

</body>

</html>
